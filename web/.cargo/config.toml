# Wasm target flags for Cloud Run release builds.
# NOTE: do NOT force +reference-types here — wasm-bindgen 0.2.12x already manages
# the externref table; forcing the LLVM feature made Table.grow failures worse
# with some toolchain combinations (see wasm-bindgen#4528).

[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+bulk-memory"]
