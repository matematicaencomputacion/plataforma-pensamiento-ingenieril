[package]
name = "plataforma-pensamiento-ingenieril-web"
version = "0.1.0"
edition = "2021"
description = "IngenierIA web shell — Leptos CSR (Wasm) pointing at the Go API"
license = "MIT"
publish = false

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-net = { version = "0.6", features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = [
  "Window",
  "Storage",
  "StorageEvent",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "Event",
  "CustomEvent",
  "CustomEventInit",
  "EventTarget",
  "SubmitEvent",
] }

[profile.release]
opt-level = "z"
lto = true
