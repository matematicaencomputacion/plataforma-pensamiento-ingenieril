[package]
name = "plataforma-pensamiento-ingenieril-web"
version = "0.1.0"
edition = "2021"
description = "IngenierIA web shell — Leptos CSR (Wasm) pointing at the Go API"
license = "MIT"
publish = false

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
