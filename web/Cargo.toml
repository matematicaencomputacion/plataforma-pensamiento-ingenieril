[package]
name = "plataforma-pensamiento-ingenieril-web"
version = "0.1.0"
edition = "2021"
description = "IngenierIA web shell — Leptos CSR (Wasm) pointing at the Go API"
license = "MIT"
publish = false

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
console_error_panic_hook = "0.1"
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-net = { version = "0.6", features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = [
  "Window",
  "Storage",
  "StorageEvent",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "Event",
  "CustomEvent",
  "CustomEventInit",
  "EventTarget",
  "SubmitEvent",
  "KeyboardEvent",
  "HtmlElement",
  "Document",
] }

[profile.release]
# Avoid LTO + size-z: they amplify wasm-bindgen externref table issues in some
# toolchains even without Binaryen (Table.grow at __wbindgen_init_externref_table).
# Size is still fine for Cloud Run without wasm-opt.
opt-level = 2
lto = false
codegen-units = 16
