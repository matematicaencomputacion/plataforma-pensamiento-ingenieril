[build]
target = "index.html"
dist = "dist"

[watch]
# Keep Playwright / Cargo artifacts from retriggering Wasm rebuilds mid-session.
ignore = ["dist", "e2e", "target"]

# Avoid colliding with the Go API on :8080 (otherwise Trunk SPA answers POST with 405).
[serve]
port = 3001
address = "127.0.0.1"

# Dev-only (`trunk serve`): browser same-origin `/api/...` → Go API.
# Trailing slashes matter for Trunk's nest_service matching (SPA fallback returns 405 on POST).
# Request: POST /api/auth/login → http://127.0.0.1:8080/api/auth/login
[[proxy]]
rewrite = "/api/"
backend = "http://127.0.0.1:8080/api/"
