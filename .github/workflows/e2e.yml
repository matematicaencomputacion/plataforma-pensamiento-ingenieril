name: E2E Web (Playwright)

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "backend/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/e2e.yml"
      - ".github/workflows/docker.yml"
  pull_request:
    branches:
      - main

concurrency:
  group: e2e-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-scope:
    name: Classify E2E scope
    runs-on: ubuntu-latest
    outputs:
      run-e2e: ${{ steps.scope.outputs.run-e2e }}
    steps:
      - name: Checkout PR history
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether product E2E is required
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "run-e2e=true" >> "${GITHUB_OUTPUT}"
            echo "Product push: run the full E2E suite."
            exit 0
          fi

          changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          printf '%s\n' "${changed_files}"
          if printf '%s\n' "${changed_files}" | grep -Eq \
            '^(web/|backend/|Dockerfile$|\.dockerignore$|\.github/workflows/(e2e|docker)\.yml$)'; then
            echo "run-e2e=true" >> "${GITHUB_OUTPUT}"
            echo "Product surface changed: run the full E2E suite."
          else
            echo "run-e2e=false" >> "${GITHUB_OUTPUT}"
            echo "No product surface changed: preserve the required check without consuming shard runners."
          fi

  # ~1145 serial Chromium tests do not fit one GHA runner (GHA max is 6h, not 12h).
  # 6 shards × 120m keeps wall-clock ~90m. Same suite as `make harness-e2e` (ADR 003).
  playwright-shard:
    name: Playwright Chromium shard ${{ matrix.shard }}/6
    needs: e2e-scope
    if: needs.e2e-scope.outputs.run-e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    env:
      JWT_SECRET: ci-e2e-only-ppi-jwt-secret
      PPI_EXPOSE_RESET_TOKEN: "1"
      DATABASE_URL: sqlite://./data/ppi-e2e.db
      LEARNER_PROFILE_LLM: mock
      # Same-origin SPA+API via Go (STATIC_DIR). Do not use `trunk serve`:
      # Trunk 0.21 always starts notify-rs, and notify-debouncer-full 0.5.0
      # panics on empty inotify events (index 0 of len 0) on GHA Linux.
      PPI_E2E_BASE_URL: http://127.0.0.1:8080
      STATIC_DIR: ${{ github.workspace }}/web/dist
      PPI_E2E_MODE: register
      # Ephemeral per-run user — no GitHub Secrets required.
      PPI_E2E_EMAIL: e2e-${{ github.run_id }}-${{ github.run_attempt }}-s${{ matrix.shard }}@example.com
      PPI_E2E_PASSWORD: secreto12ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Setup Rust (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        env:
          TRUNK_VERSION: "0.21.14"
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz
          sudo install -m 755 trunk /usr/local/bin/trunk
          trunk --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/e2e/package-lock.json

      - name: Install Playwright deps
        working-directory: web/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build Go API
        working-directory: backend
        run: |
          mkdir -p data bin
          go build -trimpath -ldflags="-s -w" -o bin/ppi-api .

      - name: Build Trunk (one-shot, no watcher)
        working-directory: web
        run: |
          # Trunk 0.21 rejects NO_COLOR=1 as a clap flag value.
          unset NO_COLOR || true
          # `trunk build` does not start notify-rs. `trunk serve` always does.
          trunk build

      - name: Start Go API + SPA (:8080)
        working-directory: backend
        run: |
          if [ ! -f "${STATIC_DIR}/index.html" ]; then
            echo "missing Trunk dist at ${STATIC_DIR}" >&2
            exit 1
          fi
          nohup ./bin/ppi-api > /tmp/ppi-api.log 2>&1 &
          echo $! > /tmp/ppi-api.pid
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:8080/api/health" >/dev/null; then
              echo "API ready"
              # Confirm STATIC_DIR SPA (not API-only) before Playwright.
              if curl -fsS "http://127.0.0.1:8080/" | grep -Eq 'import init|wasmBindings'; then
                echo "SPA ready"
                sleep 3
                exit 0
              fi
              echo "API up but SPA index is not a Trunk dist" >&2
              cat /tmp/ppi-api.log >&2 || true
              exit 1
            fi
            sleep 1
          done
          echo "API failed to start" >&2
          cat /tmp/ppi-api.log >&2 || true
          exit 1

      - name: Run Playwright smoke (shard ${{ matrix.shard }}/6)
        working-directory: web/e2e
        run: npx playwright test --shard=${{ matrix.shard }}/6

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            web/e2e/playwright-report/
            web/e2e/test-results/
          retention-days: 7

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "==== ppi-api ===="
          cat /tmp/ppi-api.log || true

  # Required check name — keep exact so branch protection stays a single story.
  playwright:
    name: Playwright Chromium smoke
    needs: [e2e-scope, playwright-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all shards
        env:
          SCOPE_RESULT: ${{ needs.e2e-scope.result }}
          RUN_E2E: ${{ needs.e2e-scope.outputs.run-e2e }}
          SHARD_RESULT: ${{ needs.playwright-shard.result }}
        run: |
          set -euo pipefail
          echo "Scope result: ${SCOPE_RESULT}"
          echo "Run E2E: ${RUN_E2E}"
          echo "Shard matrix result: ${SHARD_RESULT}"
          test "${SCOPE_RESULT}" = "success"
          if [[ "${RUN_E2E}" == "true" ]]; then
            test "${SHARD_RESULT}" = "success"
          else
            test "${RUN_E2E}" = "false"
            test "${SHARD_RESULT}" = "skipped"
          fi
