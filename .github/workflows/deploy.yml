# Deploy to Artifact Registry + Cloud Run after product gates on main.
# E2E is the slowest gate and triggers this workflow only after completion.
# Deploy then verifies CI and Docker succeeded for that exact commit.
# No service-account JSON. No Cloud Build. No Neo4j.
name: Deploy Cloud Run

on:
  workflow_run:
    workflows: ["E2E Web (Playwright)"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  PROJECT_ID: project-2dc3a0ed-9735-4291-b0b
  REGION: southamerica-east1
  AR_REPO: ppi
  SERVICE: ppi
  WIF_PROVIDER: projects/289591172332/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  DEPLOY_SA: github-deploy-sa@project-2dc3a0ed-9735-4291-b0b.iam.gserviceaccount.com

jobs:
  deploy:
    name: Artifact Registry + Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Require CI and Docker success for the same SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          require_workflow() {
            local workflow="$1"
            local json status conclusion
            json="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "${workflow}" --commit "${SHA}" --event push --json status,conclusion --limit 5)"
            status="$(printf '%s' "${json}" | jq -r '.[0].status // "missing"')"
            conclusion="$(printf '%s' "${json}" | jq -r '.[0].conclusion // "missing"')"
            echo "${workflow} status=${status} conclusion=${conclusion}"
            if [[ "${status}" != "completed" || "${conclusion}" != "success" ]]; then
              echo "::error::${workflow} no está verde para ${SHA} (status=${status}, conclusion=${conclusion}). No se despliega."
              return 1
            fi
          }

          require_workflow "CI"
          require_workflow "Docker"

      - name: Checkout SHA that passed Docker
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          token_format: access_token

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Require Secret Manager JWT_SECRET
        run: |
          set -euo pipefail
          if ! gcloud secrets describe JWT_SECRET --project="${PROJECT_ID}" >/dev/null 2>&1; then
            echo "::error::Secret Manager JWT_SECRET no es visible para ${DEPLOY_SA} (id o IAM). Cloud Run no se despliega sin él."
            exit 1
          fi

      - name: Resolve DATABASE_URL secret
        id: db
        run: |
          set -euo pipefail
          set +x
          # Presence = versions.access (roles/secretmanager.secretAccessor, docs §6).
          # `secrets describe` exige secrets.get (Viewer); JWT_SECRET lo tiene,
          # DATABASE_URL no. Tragar describe → SQLite aunque el secreto exista.
          err="$(mktemp)"
          trap 'rm -f "${err}"' EXIT
          if ! dsn="$(gcloud secrets versions access latest --secret=DATABASE_URL --project="${PROJECT_ID}" 2>"${err}")"; then
            echo "gcloud secrets versions access DATABASE_URL failed:"
            cat "${err}"
            if grep -qi 'PERMISSION_DENIED' "${err}"; then
              echo "::error::DATABASE_URL no accesible para ${DEPLOY_SA} (secretAccessor; viewer/secrets.get como JWT_SECRET si --set-secrets lo exige). No se fuerza SQLite por error de IAM."
              exit 1
            fi
            if grep -qi 'NOT_FOUND' "${err}"; then
              echo "present=false" >> "${GITHUB_OUTPUT}"
              echo "cloudsql_instance=" >> "${GITHUB_OUTPUT}"
              echo "Secret DATABASE_URL ausente: demo SQLite /tmp (PPI_ALLOW_EPHEMERAL_SQLITE=1). Ver docs/ops/gcp-iteration-plan.md"
              exit 0
            fi
            echo "::error::DATABASE_URL: error inesperado de gcloud (arriba). No se fuerza SQLite."
            exit 1
          fi
          echo "present=true" >> "${GITHUB_OUTPUT}"
          instance=""
          if [[ "${dsn}" == *"/cloudsql/"* ]]; then
            instance="$(printf '%s\n' "${dsn}" | sed -n 's/.*host=\/cloudsql\/\([^&[:space:]]*\).*/\1/p' | head -1)"
            instance="${instance%/}"
          fi
          unset dsn
          echo "cloudsql_instance=${instance}" >> "${GITHUB_OUTPUT}"
          if [[ -n "${instance}" ]]; then
            echo "Cloud SQL unix socket instance=${instance}"
          else
            echo "DATABASE_URL presente; sin host=/cloudsql/… — no se añade --set-cloudsql-instances (no se inventa el nombre)."
          fi

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/ppi:${{ env.SHA }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/ppi:latest
          build-args: |
            PPI_BUILD_ID=${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Cloud Run
        env:
          DB_SECRET_PRESENT: ${{ steps.db.outputs.present }}
          CLOUDSQL_INSTANCE: ${{ steps.db.outputs.cloudsql_instance }}
        run: |
          set -euo pipefail
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/ppi:${SHA}"
          # Público a propósito: el gateway no usa IAM; JWT vive en la app.
          # Si existe el secreto DATABASE_URL se monta (Postgres). No se inventa
          # un instance name: --set-cloudsql-instances solo si el DSN trae host=/cloudsql/…
          common=(
            --project="${PROJECT_ID}"
            --region="${REGION}"
            --image="${image}"
            --port=8080
            --allow-unauthenticated
          )
          if [[ "${DB_SECRET_PRESENT}" == "true" ]]; then
            sql_flags=(--clear-cloudsql-instances)
            if [[ -n "${CLOUDSQL_INSTANCE}" ]]; then
              sql_flags=(--set-cloudsql-instances="${CLOUDSQL_INSTANCE}")
            fi
            gcloud run deploy "${SERVICE}" \
              "${common[@]}" \
              --set-env-vars="ENV=production" \
              --set-secrets="JWT_SECRET=JWT_SECRET:latest,DATABASE_URL=DATABASE_URL:latest" \
              "${sql_flags[@]}"
            echo "deployed ${image} with Secret Manager DATABASE_URL"
          else
            gcloud run deploy "${SERVICE}" \
              "${common[@]}" \
              --set-env-vars="ENV=production,DATABASE_URL=sqlite:///tmp/ppi.db,PPI_ALLOW_EPHEMERAL_SQLITE=1" \
              --set-secrets="JWT_SECRET=JWT_SECRET:latest" \
              --clear-cloudsql-instances
            echo "::warning::Demo efímera SQLite /tmp. Crear Cloud SQL + secreto DATABASE_URL (docs/ops/gcp-iteration-plan.md). No publicar cuentas reales."
            echo "deployed ${image} sqlite demo"
          fi
