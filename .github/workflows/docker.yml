name: Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      IMAGE: ppi:ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          provenance: false
          tags: |
            ppi:ci
            ppi:${{ github.sha }}
          build-args: |
            PPI_BUILD_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke /api/health
        run: |
          set -euo pipefail
          docker image inspect ppi:ci >/dev/null
          cid="$(docker run -d --name ppi-smoke \
            -p 18080:8080 \
            -e PORT=8080 \
            -e DATABASE_URL=sqlite:///tmp/ppi.db \
            -e JWT_SECRET=ci-docker-smoke-only \
            -e LEARNER_PROFILE_LLM=mock \
            ppi:ci)"
          echo "container=${cid}"
          cleanup() {
            docker logs ppi-smoke || true
            docker rm -f ppi-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:18080/api/health" | grep -q '"status":"ok"'; then
              echo "health ok"
              curl -fsS "http://127.0.0.1:18080/" | grep -q 'import init'
              echo "spa index ok"
              exit 0
            fi
            sleep 1
          done
          echo "smoke failed" >&2
          exit 1
